# Local development stack: the API, SQL Server and Azurite (Azure Blob Storage emulator).
# Start everything:      docker compose up --build
# Only the dependencies: docker compose up sqlserver azurite
name: mawrid

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Local development password only. Override it with an .env file.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Mawrid_Dev_Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    # --skipApiVersionCheck: the Azure SDK can be newer than this Azurite image.
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=Mawrid;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Mawrid_Dev_Passw0rd};TrustServerCertificate=True"
      # Azurite's well-known development account (public, local only).
      Webhooks__AllowHttp: "true"
      FileStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started

  # A stand-in ERP that receives webhooks: create a subscription to http://mock-erp:8090/webhooks
  # with the same secret (see docs/DEVELOPMENT.md).
  mock-erp:
    build:
      context: .
      dockerfile: tools/Mawrid.MockErp/Dockerfile
    environment:
      MOCKERP_SECRET: "whsec_local-development-secret-0123456789"
    ports:
      - "8090:8090"

  # Optional local AI for invoice extraction: docker compose --profile ai up
  # then: docker compose exec ollama ollama pull qwen2.5:3b
  # and set AiExtraction__Provider=Ollama, AiExtraction__BaseUrl=http://ollama:11434/v1 on the api.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
  sqlserver-data:
  azurite-data:
