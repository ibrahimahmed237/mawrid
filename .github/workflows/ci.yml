name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mawrid.slnx

      - name: Build (warnings are errors)
        run: dotnet build Mawrid.slnx -c Release --no-restore

      # Api tests start SQL Server in Docker with Testcontainers; the runner has Docker.
      - name: Test
        run: >
          dotnet test Mawrid.slnx -c Release --no-build
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mawrid-api:ci .
